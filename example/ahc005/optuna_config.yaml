settings:
  storage: sqlite:///optuna.db
  direction: maximize
  score_type: absolute
pruner:
  threshold: 0.02
params:
  - name: START_TEMP
    type: float
    default: 100.0
    min: 1.0
    max: 1000.0
  - name: END_TEMP
    type: float
    default: 0.01
    min: 0.001
    max: min(10, params["START_TEMP"])
  - name: COOLING_RATE
    type: float
    default: 0.95
    min: 0.8
    max: 0.999
ignore_params:
  - COOLING_RATE
