settings:
  storage_path: sqlite:///optuna.db
  timeout: 30
  direction: minimize
  score_type: absolute
pruner:
  threshold: 0.02
params:
  - name: n_coef
    type: float
    rust_type: f64
    default: 5.0
    min: 1.0
    max: 10.0
  - name: m_coef
    type: float
    rust_type: f64
    default: 5.0
    min: 1.0
    max: 10.0
ignore_params: []
