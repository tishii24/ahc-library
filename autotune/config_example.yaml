basedir: .autotune
optuna_config_path: config_example.yaml
timeout: 600
num_total_seed: 50
max_num_per_group: 10
input_params:
  - name: N
    type: int
    min: 5
    max: 20
    parser:
      type: constant
      params:
        index: 0
    partitions: [5, 10, 15, 20]
  - name: M
    type: int
    min: 100
    max: 300
    parser:
      type: constant
      params:
        index: 1
    partitions: [100, 200, 300]
optuna:
  settings:
    storage_path: optuna.db
    direction: maximize
    score_type: relative
  pruner:
    threshold: 0.02
  params:
    - name: START_TEMP
      type: float
      default: 10.0
      min: 1.0
      max: 10000.0
    - name: END_TEMP
      type: float
      default: 1e-1
      min: 1e-3
      max: 1e-1
    - name: COOLING_RATE
      type: float
      default: 0.95
      min: 0.8
      max: 0.999
  ignore_params:
    - COOLING_RATE
